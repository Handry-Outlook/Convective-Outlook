    L.Edit.Poly.prototype._createVertexMarkers = function() {
        if (!this._poly) {
            console.error("No polygon associated with this edit handler.");
            return;
        }
        this._markers = [];
        var latlngs = this._poly.getLatLngs()[0]; // Assumes simple polygon
        for (var i = 0; i < latlngs.length; i++) {
            var marker = new L.Marker(latlngs[i], {
                draggable: true,
                icon: L.divIcon({ className: 'leaflet-div-icon leaflet-editing-icon', iconSize: [8, 8] }),
                pane: 'drawnPane'
            });
            marker._index = i;
            this._markers.push(marker);
            marker.addTo(map); // Explicitly add to map
            marker.on('drag', this._onMarkerDrag, this);
            if (!marker._icon) {
                marker._initIcon();
                map.getPane('drawnPane').appendChild(marker._icon);
            }
        }
        console.log("Created", this._markers.length, "vertex markers for poly editing");
    };
    
    L.Edit.Poly.prototype._onMarkerDrag = function(e) {
        var marker = e.target;
        var index = marker._index;
        var latlngs = this._poly.getLatLngs()[0];
        latlngs[index] = marker.getLatLng();
        this._poly.setLatLngs(latlngs);
        this._poly.redraw(); // Force redraw to update visually
    };
    
    function filterExpiredOutlooks() {
        const now = new Date();
        const dropdown = document.getElementById('kmlDropdown');
        dropdown.innerHTML = '<option value="none">None</option>';

        let validOptions = [];
        for (let kmlId in kmlTimes) {
            const start = new Date(kmlTimes[kmlId].start);
            const end = new Date(kmlTimes[kmlId].end);
            if (end < now) continue;  // Skip expired
            validOptions.push({
                kmlId: kmlId,
                label: kmlVersions[kmlId],
                start: start,
                version: parseInt(kmlVersions[kmlId].split('Version ')[1])
            });
        }

        validOptions.sort((a, b) => b.version - a.version || a.start - b.start);
        validOptions.forEach(item => {
            const option = document.createElement('option');
            option.value = item.kmlId;
            option.text = item.label;
            dropdown.appendChild(option);
        });

        const defaultOption = validOptions.length > 0 ? validOptions[0].kmlId : 'none';
        dropdown.value = defaultOption;
        showLayer(defaultOption);
    }
    
    function getCurrentShapeOptions() {
        var riskLevel = document.getElementById('riskLevel').value;
        var colorPickerValue = document.getElementById('polygonColor').value;
        var defaultColor = riskColorsCal[riskLevel] || '#000000';
        var color = userChangedColor ? colorPickerValue : defaultColor;
        
        return {
            color: color,
            fillColor: riskLevel === 'Severe risk' ? 'black' : color,
            fillOpacity: riskLevel === 'Severe risk' ? 0 : 0.3,
            weight: riskLevel === 'Severe risk' ? 2 : 1
        };
    }

    function updateDrawOptions() {
        if (drawControl) {
            var shapeOptions = getCurrentShapeOptions();
            // Update drawing options without removing the control
            drawControl.options.draw.polygon.shapeOptions = shapeOptions;
            // If currently drawing, this won't affect the active tool, but new polygons will use updated options
            console.log("Draw options updated:", shapeOptions);
        }
    }

    function exportToKML() {
        if (!drawnItems || drawnItems.getLayers().length === 0) {
            alert('No drawn items to export.');
            return;
        }
        var kml = '<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>';
        drawnItems.eachLayer(function(layer) {
            if (layer instanceof L.Polygon && map.hasLayer(layer)) {
                var riskLevel = layer.feature.properties['Name'];
                var color = layer.options.color || '#000000';
                var kmlColor = hexToKmlColor(color, riskLevel === 'Severe risk' ? 0 : 0.8);
                var lineKmlColor = hexToKmlColor(color, 1.0);
                var coordinates = layer.getLatLngs()[0].map(function(latlng) {
                    return latlng.lng + ',' + latlng.lat + ',0';
                }).join(' ');
                kml += '<Placemark><name>' + riskLevel + '</name>';
                kml += '<Style><LineStyle><color>' + lineKmlColor + '</color><width>3</width></LineStyle>';
                kml += '<PolyStyle><color>' + kmlColor + '</color></PolyStyle></Style>';
                kml += '<Polygon><outerBoundaryIs><LinearRing><coordinates>' + coordinates + '</coordinates></LinearRing></outerBoundaryIs></Polygon>';
                kml += '</Placemark>';
            }
        });
        kml += '</Document></kml>';
        var fileName = prompt('Enter KML file name:', 'user_drawn_polygons.kml');
        if (fileName) {
            var blob = new Blob([kml], {type: 'application/vnd.google-earth.kml+xml'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    }

    function hexToKmlColor(hex, alpha) {
        hex = hex.replace('#', '');
        var r = parseInt(hex.substring(0,2), 16);
        var g = parseInt(hex.substring(2,4), 16);
        var b = parseInt(hex.substring(4,6), 16);
        var a = Math.round(alpha * 255).toString(16).padStart(2, '0');
        return a + b.toString(16).padStart(2, '0') + g.toString(16).padStart(2, '0') + r.toString(16).padStart(2, '0');
    }

                    <option value="Moderate risk" ${currentRisk === 'Moderate risk' ? 'selected' : ''}>Moderate risk</option>
                    <option value="High risk" ${currentRisk === 'High risk' ? 'selected' : ''}>High risk</option>
                    <option value="Severe risk" ${currentRisk === 'Severe risk' ? 'selected' : ''}>Severe risk</option>

                <label for="editColor">Color:</label>

                <button onclick="deletePolygon('${layer._leaflet_id}')" style="width: 100%; padding: 5px; margin-top: 5px;">Delete</button>

        layer.bindPopup(popupContent, { closeButton: true }).openPopup(latlng);

    window.editPolygonShape = function(layerId) {
        var layer = drawnItems.getLayer(layerId);
        if (!layer) {
            console.error("Layer not found in drawnItems:", layerId);
            return;
        }
        if (!drawControl) {
            console.error("drawControl is not initialized.");
            return;
        }

        var editToolbar = drawControl._toolbars.edit;
        if (!editToolbar) {
            console.error("Edit toolbar not found in drawControl.");
            return;
        }

        var editHandler = editToolbar._modes.edit.handler;
        if (!editHandler) {
            console.error("Edit handler not found in edit toolbar.");
            return;
        }

        // Ensure layer is on the map and in drawnItems
        if (!map.hasLayer(layer)) {
            map.addLayer(layer);
            console.warn("Layer was not on the map; added back:", layerId);
        }
        if (!drawnItems.hasLayer(layer)) {
            drawnItems.addLayer(layer);
            console.warn("Layer was not in drawnItems; added back:", layerId);
        }

        // Disable any active drawing
        if (drawControl._toolbars.draw._modes.polygon.handler._enabled) {
            drawControl._toolbars.draw._modes.polygon.handler.disable();
            console.log("Disabled active polygon drawing before enabling edit.");
        }

        // Ensure editing is properly initialized
        if (!layer.editing) {
            layer.editing = new L.Edit.Poly(layer);
            console.log("Initialized L.Edit.Poly for layer:", layerId);
        }

        // Manually reset and initialize vertex markers if needed
        if (!layer.editing._poly || !layer.editing._markers || layer.editing._markers.length === 0) {
            layer.editing._poly = layer; // Ensure the poly reference is set
            layer.editing._createVertexMarkers(); // Custom method to initialize markers
            console.log("Reinitialized vertex markers for layer:", layerId);
        }

        try {
            editHandler.enable();
            editHandler._editLayers = [layer];
            document.querySelector('.leaflet-draw').style.display = 'block';
            drawToolbarVisible = true;
            console.log("Edit mode enabled successfully for layer:", layerId);
        } catch (e) {
            console.error("Error enabling edit mode:", e);
            // Fallback: manually enable dragging
            layer.editing._markers.forEach(function(marker) {
                marker.dragging.enable();
            });
        }

        // Ensure polygon updates on dragend
        layer.editing._markers.forEach(function(marker) {
            marker.on('dragend', function() {
                layer.redraw();
                console.log("Polygon redrawn after dragend:", layer.toGeoJSON());
            });
        });
    };

    function isBST(date) {
        var year = date.getFullYear();
        var bstStart = new Date(Date.UTC(year, 2, 31 - (new Date(year, 2, 31).getDay() || 7), 1, 0, 0, 0));
        var bstEnd = new Date(Date.UTC(year, 9, 31 - (new Date(year, 9, 31).getDay() || 7), 1, 0, 0, 0));
        return date >= bstStart && date < bstEnd;
    }

    function formatTime(hours, mins, isBst) {
        var displayHours = isBst ? (hours + 1) % 24 : hours;
        return `${String(displayHours).padStart(2, '0')}:${String(mins).padStart(2, '0')} ${isBst ? 'BST' : 'UTC'}`;
    }

    function getTimeDifferenceInMs(rangeValue, unit) {
        switch (unit) {
            case 'minutes': return rangeValue * 60 * 1000;
            case 'hours': return rangeValue * 60 * 60 * 1000;
            case 'days': return rangeValue * 24 * 60 * 60 * 1000;
            case 'months': return rangeValue * 30 * 24 * 60 * 60 * 1000;
            case 'years': return rangeValue * 365 * 24 * 60 * 60 * 1000;
            default: return rangeValue * 60 * 60 * 1000;
        }
    }

    function calculateLightningNowcast(lightningData) {
        if (!lightningData || lightningData.length < 2) return [];
        var now = new Date();
        var baseTimeThreshold = now.getTime() - (2 * 60 * 60 * 1000);
        var recentTimeThreshold = now.getTime() - (60 * 60 * 1000);
        var futureBuffer = 5 * 60 * 1000;
        var maxTimeThreshold = now.getTime() - (9 * 60 * 60 * 1000);
        var gapThreshold = 15 * 60 * 1000;

        var recentStrikes = lightningData
            .map(strike => ({
                lat: parseFloat(strike.latitude || strike.lat || 0),
                lon: parseFloat(strike.longitude || strike.lon || 0),
                time: new Date(strike.timestamp || strike.time || now).getTime()
            }))
            .filter(strike => strike.time >= baseTimeThreshold - futureBuffer && !isNaN(strike.lat) && !isNaN(strike.lon))
            .sort((a, b) => a.time - b.time);

        var allStrikes = lightningData
            .map(strike => ({
                lat: parseFloat(strike.latitude || strike.lat || 0),
                lon: parseFloat(strike.longitude || strike.lon || 0),
                time: new Date(strike.timestamp || strike.time || now).getTime()
            }))
            .filter(strike => !isNaN(strike.lat) && !isNaN(strike.lon))
            .sort((a, b) => a.time - b.time);

        var extendedStrikes = recentStrikes.slice();
        if (extendedStrikes.length > 0) {
            var latestTime = extendedStrikes[extendedStrikes.length - 1].time;
            for (var i = allStrikes.length - 1; i >= 0; i--) {
                var strike = allStrikes[i];
                if (strike.time < baseTimeThreshold && strike.time >= maxTimeThreshold) {
                    var timeGap = latestTime - strike.time;
                    if (timeGap <= gapThreshold) {
                        extendedStrikes.unshift(strike);
                        latestTime = strike.time;
                    } else {
                        break;
                    }
                }
            }
        }

        if (extendedStrikes.length < 2) return [];

        var distances = [];
        var timeDiffs = [];
        for (var i = 1; i < extendedStrikes.length; i++) {
            var strike1 = extendedStrikes[i - 1];
            var strike2 = extendedStrikes[i];
            var latFactor = Math.cos((strike1.lat * Math.PI) / 180);
            var dx = (strike2.lon - strike1.lon) * 111 * latFactor;
            var dy = (strike2.lat - strike1.lat) * 111;
            var distanceKm = Math.sqrt(dx * dx + dy * dy);
            var timeDiffMs = strike2.time - strike1.time;
            if (distanceKm > 0) distances.push(distanceKm);
            if (timeDiffMs > 0) timeDiffs.push(timeDiffMs);
        }

        var maxDistanceKm, minDistanceKm, maxTimeMs, minTimeMs;
        if (distances.length > 0) {
            distances.sort((a, b) => a - b);
            minDistanceKm = Math.min(distances[Math.floor(distances.length * 0.05)] || 1.0, 1.0);
            maxDistanceKm = Math.min(distances[Math.floor(distances.length * 0.95)] * 1.2 || 50, 100);
        } else {
            minDistanceKm = 0.5;
            maxDistanceKm = 50;
        }

        if (timeDiffs.length > 0) {
            timeDiffs.sort((a, b) => a - b);
            minTimeMs = Math.min(timeDiffs[Math.floor(timeDiffs.length * 0.05)] || 1000, 1000);
            maxTimeMs = Math.min(timeDiffs[Math.floor(timeDiffs.length * 0.95)] * 2 || 3600000, 60 * 60 * 1000);
        } else {
            minTimeMs = 1000;
            maxTimeMs = 180 * 60 * 1000;
        }

        var clusters = [];
        var used = new Array(extendedStrikes.length).fill(false);
        for (var i = extendedStrikes.length - 1; i >= 0; i--) {
            if (used[i]) continue;
            var cluster = [extendedStrikes[i]];
            used[i] = true;

            for (var j = extendedStrikes.length - 1; j >= 0; j--) {
                if (used[j]) continue;
                var strike1 = extendedStrikes[i];
                var strike2 = extendedStrikes[j];
                var latFactor = Math.cos((strike1.lat * Math.PI) / 180);
                var dx = (strike2.lon - strike1.lon) * 111 * latFactor;
                var dy = (strike2.lat - strike1.lat) * 111;
                var distanceKm = Math.sqrt(dx * dx + dy * dy);
                var timeDiffMs = Math.abs(strike2.time - strike1.time);

                if (distanceKm >= minDistanceKm && distanceKm <= maxDistanceKm && 
                    timeDiffMs >= minTimeMs && timeDiffMs <= maxTimeMs) {
                    cluster.push(strike2);
                    used[j] = true;
                }
            }
            if (cluster.length >= 10) {
                clusters.push(cluster);
            }
        }

        var nowcastResults = [];
        var clusterInfos = [];

        for (var c = 0; c < clusters.length; c++) {
            var cluster = clusters[c];
            if (cluster.length < 3) continue;

            cluster.sort((a, b) => a.time - b.time);
            var latestStrike = cluster[cluster.length - 1];

            if (latestStrike.time < recentTimeThreshold) continue;

            var baseLat = latestStrike.lat;
            var baseLon = latestStrike.lon;
            var latFactor = Math.cos((baseLat * Math.PI) / 180);

            var minTime = cluster[0].time;
            var maxTime = cluster[cluster.length - 1].time;
            var binSize = 1000 * 1000;
            var bins = [];
            for (var t = minTime; t < maxTime; t += binSize) {
                var binStart = t;
                var binEnd = t + binSize;
                var binStrikes = cluster.filter(s => s.time >= binStart && s.time < binEnd);
                if (binStrikes.length > 0) {
                    var sumLat = 0, sumLon = 0;
                    binStrikes.forEach(s => {
                        sumLat += s.lat;
                        sumLon += s.lon;
                    });
                    var centroidLat = sumLat / binStrikes.length;
                    var centroidLon = sumLon / binStrikes.length;
                    var binTime = (binStart + binEnd) / 2;
                    bins.push({ time: binTime, lat: centroidLat, lon: centroidLon, count: binStrikes.length });
                }
            }

            var speedLatDegPerSec = 0, speedLonDegPerSec = 0, regressionScore = 0, directionDeg = 0;
            if (bins.length >= 2) {
                var sumT = 0, sumLat = 0, sumLon = 0, sumTLat = 0, sumTLon = 0, sumT2 = 0, sumWeights = 0;
                var sumLat2 = 0, sumLon2 = 0;
                bins.forEach(b => {
                    var t = (b.time - minTime) / 1000;
                    var weight = b.count;
                    sumWeights += weight;
                    sumT += t * weight;
                    sumLat += b.lat * weight;
                    sumLon += b.lon * weight;
                    sumTLat += t * b.lat * weight;
                    sumTLon += t * b.lon * weight;
                    sumT2 += t * t * weight;
                    sumLat2 += b.lat * b.lat * weight;
                    sumLon2 += b.lon * b.lon * weight;
                });
                var n = sumWeights;
                var denominator = sumT2 * n - sumT * sumT;
                speedLatDegPerSec = denominator !== 0 ? (sumTLat * n - sumT * sumLat) / denominator : 0;
                speedLonDegPerSec = denominator !== 0 ? (sumTLon * n - sumT * sumLon) / denominator : 0;

                var meanLat = sumLat / n;
                var meanLon = sumLon / n;
                var ssTotLat = sumLat2 - (sumLat * sumLat) / n;
                var ssTotLon = sumLon2 - (sumLon * sumLon) / n;
                var ssResLat = 0, ssResLon = 0;
                bins.forEach(b => {
                    var t = (b.time - minTime) / 1000;
                    var weight = b.count;
                    var predictedLat = meanLat + speedLatDegPerSec * (t - sumT / n);
                    var predictedLon = meanLon + speedLonDegPerSec * (t - sumT / n);
                    ssResLat += weight * Math.pow(b.lat - predictedLat, 2);
                    ssResLon += weight * Math.pow(b.lon - predictedLon, 2);
                });
                var r2Lat = ssTotLat > 0 ? 1 - ssResLat / ssTotLat : 0;
                var r2Lon = ssTotLon > 0 ? 1 - ssResLon / ssTotLon : 0;
                regressionScore = (r2Lat + r2Lon) / 2;

                var earlyLat = 0, earlyLon = 0, lateLat = 0, lateLon = 0, earlyWeight = 0, lateWeight = 0;
                var midTime = (minTime + maxTime) / 2;
                cluster.forEach(s => {
                    var weight = (maxTime - s.time) / (maxTime - minTime);
                    if (s.time <= midTime) {
                        earlyLat += s.lat * weight;
                        earlyLon += s.lon * weight;
                        earlyWeight += weight;
                    } else {
                        lateLat += s.lat * (1 - weight);
                        lateLon += s.lon * (1 - weight);
                        lateWeight += (1 - weight);
                    }
                });
                earlyLat /= earlyWeight || 1;
                earlyLon /= earlyWeight || 1;
                lateLat /= lateWeight || 1;
                lateLon /= lateWeight || 1;
                var dx = (lateLon - earlyLon) * 111 * latFactor;
                var dy = lateLat - earlyLat;
                directionDeg = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
            }

            var binVelocitiesDx = [], binVelocitiesDy = [];
            for (var i = 1; i < bins.length; i++) {
                var bin1 = bins[i - 1];
                var bin2 = bins[i];
                var dt = (bin2.time - bin1.time) / 1000;
                if (dt > 0) {
                    var dx = (bin2.lon - bin1.lon) * 111 * latFactor / dt;
                    var dy = (bin2.lat - bin1.lat) * 111 / dt;
                    binVelocitiesDx.push(dx);
                    binVelocitiesDy.push(dy);
                }
            }
            var meanBinDx = binVelocitiesDx.length > 0 ? binVelocitiesDx.reduce((a, b) => a + b, 0) / binVelocitiesDx.length : 0;
            var meanBinDy = binVelocitiesDy.length > 0 ? binVelocitiesDy.reduce((a, b) => a + b, 0) / binVelocitiesDy.length : 0;
            var varBinDx = binVelocitiesDx.length > 1 ? binVelocitiesDx.reduce((a, b) => a + Math.pow(b - meanBinDx, 2), 0) / (binVelocitiesDx.length - 1) : 0;
            var varBinDy = binVelocitiesDy.length > 1 ? binVelocitiesDy.reduce((a, b) => a + Math.pow(b - meanBinDy, 2), 0) / (binVelocitiesDy.length - 1) : 0;
            var velocityScore = Math.max(0, 1 - (varBinDx + varBinDy) / 0.01);

            var finalDx = speedLonDegPerSec * 3600 * 111 * latFactor;
            var finalDy = speedLatDegPerSec * 3600 * 111;
            var timeSpanMs = maxTime - minTime;

            if (bins.length < 2 || Math.sqrt(finalDx * finalDx + finalDy * finalDy) < 1e-6) {
                var velocities = [];
                for (var i = 1; i < cluster.length; i++) {
                    var s1 = cluster[i - 1];
                    var s2 = cluster[i];
                    var dt = (s2.time - s1.time) / 1000;
                    if (dt > 0) {
                        var dx = (s2.lon - s1.lon) * 111 * latFactor / dt;
                        var dy = (s2.lat - s1.lat) * 111 / dt;
                        var speedKmH = Math.sqrt(dx * dx + dy * dy) * 3600;
                        velocities.push(speedKmH);
                    }
                }
                velocities.sort((a, b) => a - b);
                var medianSpeedKmH = velocities.length > 0 ? 
                    (velocities.length % 2 === 0 ? 
                        (velocities[velocities.length / 2 - 1] + velocities[velocities.length / 2]) / 2 : 
                        velocities[Math.floor(velocities.length / 2)]) : 10;
                var earlyLat = 0, earlyLon = 0, lateLat = 0, lateLon = 0, earlyWeight = 0, lateWeight = 0;
                var midTime = (minTime + maxTime) / 2;
                cluster.forEach(s => {
                    var weight = (maxTime - s.time) / (maxTime - minTime);
                    if (s.time <= midTime) {
                        earlyLat += s.lat * weight;
                        earlyLon += s.lon * weight;
                        earlyWeight += weight;
                    } else {
                        lateLat += s.lat * (1 - weight);
                        lateLon += s.lon * (1 - weight);
                        lateWeight += (1 - weight);
                    }
                });
                earlyLat /= earlyWeight || 1;
                earlyLon /= earlyWeight || 1;
                lateLat /= lateWeight || 1;
                lateLon /= lateWeight || 1;
                var dx = (lateLon - earlyLon) * 111 * latFactor;
                var dy = lateLat - earlyLat;
                directionDeg = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
                finalDx = medianSpeedKmH * Math.cos(directionDeg * Math.PI / 180) / (3600 * 111 * latFactor);
                finalDy = medianSpeedKmH * Math.sin(directionDeg * Math.PI / 180) / (3600 * 111);
                regressionScore = 0.5;
                velocityScore = 0.5;
            }

            var speedKmH = Math.sqrt(finalDx * finalDx + finalDy * finalDy);

            var maxClusterDistanceKm = 0;
            for (var i = 0; i < cluster.length - 1; i++) {
                for (var j = i + 1; j < cluster.length; j++) {
                    var dx = (cluster[j].lon - cluster[i].lon) * 111 * latFactor;
                    var dy = (cluster[j].lat - cluster[i].lat) * 111;
                    var distanceKm = Math.sqrt(dx * dx + dy * dy);
                    maxClusterDistanceKm = Math.max(maxClusterDistanceKm, distanceKm);
                }
            }

            var strikeDensity = cluster.length / (maxClusterDistanceKm || 1);
            var densityScore = Math.min(strikeDensity / 0.3, 1);
            var timeScore = Math.max(0, 1 - timeSpanMs / (180 * 60 * 1000));
            var confidenceScore = (densityScore * 0.35 + timeScore * 0.2 + regressionScore * 0.35 + velocityScore * 0.1);

            if (confidenceScore < 0.55) continue;

            clusterInfos.push({
                index: c,
                speedKmH: speedKmH,
                directionDeg: directionDeg,
                baseLat: baseLat,
                baseLon: baseLon,
                confidenceScore: confidenceScore,
                maxClusterDistanceKm: maxClusterDistanceKm
            });
        }

        for (var c = 0; c < clusterInfos.length; c++) {
            var clusterInfo = clusterInfos[c];
            var baseLat = clusterInfo.baseLat;
            var baseLon = clusterInfo.baseLon;
            var latFactor = Math.cos((baseLat * Math.PI) / 180);
            var initialSpeedKmH = clusterInfo.speedKmH;
            var initialDirectionDeg = clusterInfo.directionDeg;
            var confidenceScore = clusterInfo.confidenceScore;
            var maxClusterDistanceKm = clusterInfo.maxClusterDistanceKm;

            var neighborCount = 1;
            var neighborSpeeds = [initialSpeedKmH];
            var neighborSinSum = Math.sin(initialDirectionDeg * Math.PI / 180);
            var neighborCosSum = Math.cos(initialDirectionDeg * Math.PI / 180);
            for (var nc = 0; nc < clusterInfos.length; nc++) {
                if (nc === c) continue;
                var otherCluster = clusterInfos[nc];
                var otherLat = otherCluster.baseLat;
                var otherLon = otherCluster.baseLon;
                var distToNeighbor = Math.sqrt(
                    Math.pow((otherLon - baseLon) * 111 * latFactor, 2) + 
                    Math.pow((otherLat - baseLat) * 111, 2)
                );
                if (distToNeighbor <= 400) {
                    neighborSpeeds.push(otherCluster.speedKmH);
                    neighborSinSum += Math.sin(otherCluster.directionDeg * Math.PI / 180);
                    neighborCosSum += Math.cos(otherCluster.directionDeg * Math.PI / 180);
                    neighborCount++;
                }
            }

            var moderatedSpeedKmH, moderatedDirectionDeg;
            if (neighborCount < 3) {
                moderatedSpeedKmH = initialSpeedKmH;
                moderatedDirectionDeg = initialDirectionDeg;
            } else {
                moderatedSpeedKmH = neighborSpeeds.reduce((a, b) => a + b, 0) / neighborCount;
                var moderatedDirectionRad = Math.atan2(neighborSinSum / neighborCount, neighborCosSum / neighborCount);
                moderatedDirectionDeg = (moderatedDirectionRad * 180 / Math.PI + 360) % 360;
            }

            var clusterRadiusKm = maxClusterDistanceKm / 2;
            var clusterRadiusDeg = clusterRadiusKm / 111;
            var color = confidenceScore >= 0.95 ? 'purple' :
                        confidenceScore >= 0.82 ? 'red' :
                        confidenceScore >= 0.55 ? 'orange' : '#5aac91';

            nowcastResults.push({
                centerLat: baseLat,
                centerLon: baseLon,
                clusterRadiusDeg: clusterRadiusDeg,
                color: color,
                confidenceScore: confidenceScore.toFixed(2),
                hasCone: false
            });

            if (neighborCount >= 3 && Math.abs(baseLat) > 7) {
                var directionRad = moderatedDirectionDeg * Math.PI / 180;
                var finalDx = moderatedSpeedKmH * Math.cos(directionRad) / (3600 * 111 * latFactor);
                var finalDy = moderatedSpeedKmH * Math.sin(directionRad) / (3600 * 111);

                var predictedLat = baseLat + finalDy * 10800;
                var predictedLon = baseLon + finalDx * 10800;

                if (isNaN(predictedLat) || isNaN(predictedLon)) {
                    predictedLat = baseLat;
                    predictedLon = baseLon;
                    moderatedSpeedKmH = 10;
                    finalDx = 10 / (3600 * 111 * latFactor);
                    finalDy = 0;
                    moderatedDirectionDeg = 90;
                }

                var sectorRadiusKm = moderatedSpeedKmH * 3;
                var sectorRadiusDeg = sectorRadiusKm / 111;
                var maxAngle = 120;
                var minAngle = 30;
                var sectorAngle = maxAngle - (confidenceScore * (maxAngle - minAngle));
                sectorAngle = Math.max(minAngle, Math.min(maxAngle, sectorAngle));

                nowcastResults.push({
                    centerLat: baseLat,
                    centerLon: baseLon,
                    sectorRadiusDeg: sectorRadiusDeg,
                    directionDeg: moderatedDirectionDeg,
                    sectorAngle: sectorAngle,
                    clusterRadiusDeg: clusterRadiusDeg,
                    color: color,
                    speed_km_h: moderatedSpeedKmH.toFixed(1),
                    direction_deg: moderatedDirectionDeg.toFixed(1),
                    time: new Date().toISOString(),
                    confidenceScore: confidenceScore.toFixed(2),
                    hasCone: true
                });
            }
        }

        return nowcastResults;
    }

            getTimeDifferenceInMs(rangeValue, unit);
        startTime = new Date(selectedTime.getTime() - timeDiffMs);

                    var endAngle = (directionDeg + nowcast.sectorAngle / 2) * Math.PI / 180;

                    var sectorPoints = [[centerLat, centerLon]];
                    for (var a = startAngle; a <= endAngle; a += 0.1) {
                        var lat = centerLat + radiusDeg * Math.sin(a);
                        var lon = centerLon + (radiusDeg * Math.cos(a)) / Math.cos(centerLat * Math.PI / 180);

            var radarTime = new Date(radarTimestamp * 1000);

        }

        var satelliteDisplay = '';
        if (satelliteVisible && satelliteData.length > 0) {
            var selectedTimestamp = Math.floor(selectedTime.getTime() / 1000);
            var satelliteFrame = satelliteData.reduce((prev, curr) => 
                Math.abs(curr.time - selectedTimestamp) < Math.abs(prev.time - selectedTimestamp) ? curr : prev
            );
            var satelliteHash = satelliteFrame.path.split('/')[3];

        if (radarDisplay && satelliteDisplay) {

        } else if (radarDisplay) {

    function updateCalendar() {
        var monthDropdown = document.getElementById('monthDropdown');
        var yearDropdown = document.getElementById('yearDropdown');
        if (!monthDropdown || !yearDropdown) return;
        var month = parseInt(monthDropdown.value);
        var year = parseInt(yearDropdown.value);
        var monthStart = new Date(Date.UTC(year, month - 1, 1));
        var nextMonth = new Date(Date.UTC(year, month, 1));
        var firstDay = monthStart.getUTCDay() === 0 ? 6 : monthStart.getUTCDay() - 1;
        var currentDay = new Date(monthStart);
        var now = new Date();
        var currentDateStr = now.toISOString().split('T')[0];

        var calendarHtml = '<table style="border-collapse: collapse; width: 100%;" id="calendarTable"><tr><th colspan="7">' + 
            monthStart.toLocaleString('default', {month: 'long'}) + ' ' + year + 
            '</th></tr><tr>';
        var days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        for (var day of days) {
            calendarHtml += '<th style="font-size: 0.8em;">' + day + '</th>';
        }
        calendarHtml += '</tr><tr>';
        for (var i = 0; i < firstDay; i++) {
            calendarHtml += '<td></td>';
        }
        while (currentDay < nextMonth) {
            var dateStr = currentDay.toISOString().split('T')[0];
            var risks = dateRisks[dateStr] || [];
            var hocos = dateHocos[dateStr] || [];
            var bgColor = 'white';
            var borderStyle = 'border: 1px solid black';
            var textColor = 'black';
            var kmlId = 'none';
            var hocoIndicator = hocos.length > 0 ? '★' : ''; // Star indicates HOCO availability
            if (risks.length > 0) {
                var primaryRisks = risks.filter(function(risk) {return !risk[0].startsWith('Risk of');});
                var highestRisk = primaryRisks.length > 0 ? 
                    primaryRisks.reduce(function(min, curr) { 
                        return (riskPriority[curr[0]] || 10) < (riskPriority[min[0]] || 10) ? curr : min; 
                    })[0] : null;
                kmlId = risks[0][1];
                bgColor = highestRisk ? riskColorsCal[highestRisk] || 'white' : 'white';
                var hasRiskOf = risks.some(function(risk) {return risk[0].startsWith('Risk of');});
                borderStyle = hasRiskOf ? 'border: 2px solid black' : 'border: 1px solid black';
                textColor = (bgColor === 'red' || bgColor === 'purple') ? 'white' : 'black';
            }
            if (hocos.length > 0) {
                borderStyle += '; border-bottom: 3px dashed green'; // Indicate HOCO with dashed green border
            }
            if (dateStr === currentDateStr) {
                borderStyle += '; border: 3px solid blue';
            }
            var hocoIndicator = hocos.length > 0 ? ' (H)' : ''; // Changed from '★' to ' (H)'
            calendarHtml += '<td style="background-color: ' + bgColor + '; ' + borderStyle + '; text-align: center; cursor: pointer; color: ' + textColor + '; font-size: 0.8em; padding: 0.2em;" ' +
                'onclick="selectDate(\'' + dateStr + '\');">' + currentDay.getUTCDate() + hocoIndicator + '</td>';
            if (currentDay.getUTCDay() === 0) {
                calendarHtml += '</tr><tr>';
            }
            currentDay.setUTCDate(currentDay.getUTCDate() + 1);
        }
        calendarHtml += '</tr></table>';
        document.getElementById('calendarContainer').innerHTML = calendarHtml;
    }

    function fetchLightningData() {
        Promise.all([
            fetch('https://raw.githubusercontent.com/Handry-Outlook/lightning-map/main/strikes.json').then(response => response.json()),
            fetch('https://raw.githubusercontent.com/Handry6/lightning-map2/main/strikes.json').then(response => response.json()),
            fetch('https://raw.githubusercontent.com/HandryOutlook/lightning-map3/main/strikes.json').then(response => response.json()),
            fetch('https://raw.githubusercontent.com/HeiChitLuk/lightning-map3/main/strikes.json').then(response => response.json()),
            fetch('https://raw.githubusercontent.com/HandryOutlook/lightning-map4/main/strikes.json').then(response => response.json())
        ])
        .then(([data1, data2, data3, data4, data5]) => {
            var combinedData = [...data1, ...data2, ...data3, ...data4, ...data5];
            var seen = new Set();
            lightningData = combinedData.filter(strike => {
                var key = `${strike.timestamp || strike.time || ''}|${strike.latitude || strike.lat || ''}|${strike.longitude || strike.lon || ''}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
            updateWeatherOverlays();
            updateHocoLayer();
        })
        .catch(error => console.error('Error fetching lightning data:', error));
    }

    function fetchWeatherTimestamps() {
        return fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(response => response.json())
            .then(data => {
                radarTimestamps = data.radar.past.map(ts => parseInt(ts.time)).sort();
                satelliteData = data.satellite.infrared;
                earliestRadarTime = radarTimestamps[0] * 1000;
                latestRadarTime = radarTimestamps[radarTimestamps.length - 1] * 1000;
                earliestSatelliteTime = satelliteData[0].time * 1000;
                latestSatelliteTime = satelliteData[satelliteData.length - 1].time * 1000;
                lastRadarFetchTime = latestRadarTime;
                updateWeatherOverlays();
            })
            .catch(error => console.error('Error fetching weather timestamps:', error));
    }

    function toggleLightning() {
        lightningVisible = !lightningVisible;
        document.getElementById('toggleLightning').innerHTML = lightningVisible ? 'Hide Lightning' : 'Show Lightning';
        updateWeatherOverlays();
    }

    function toggleRadar() {
        radarVisible = !radarVisible;
        document.getElementById('toggleRadar').innerHTML = radarVisible ? 'Hide Radar' : 'Show Radar';
        updateWeatherOverlays();
    }

    function toggleSatellite() {
        satelliteVisible = !satelliteVisible;
        document.getElementById('toggleSatellite').innerHTML = satelliteVisible ? 'Hide Satellite' : 'Show Satellite';
        updateWeatherOverlays();
    }

    function toggleNowcast() {
        nowcastVisible = !nowcastVisible;
        document.getElementById('toggleNowcast').innerHTML = nowcastVisible ? 'Hide Nowcast' : 'Show Nowcast';
        updateWeatherOverlays();
    }

    function updateSliderToLatest() {
        var latestTime = new Date(Math.max(latestRadarTime, latestSatelliteTime || 0, Date.now()));
        var utcHours = latestTime.getUTCHours();
        var utcMinutes = latestTime.getUTCMinutes();
        var sliderValue = utcHours * 60 + utcMinutes;
        document.getElementById('timeSlider').value = sliderValue;
        selectedDate = latestTime;
        updateWeatherOverlays();
    }

    function updateCalendar() {
        var monthDropdown = document.getElementById('monthDropdown');
        var yearDropdown = document.getElementById('yearDropdown');
        if (!monthDropdown || !yearDropdown) return;
        var month = parseInt(monthDropdown.value);
        var year = parseInt(yearDropdown.value);
        var monthStart = new Date(Date.UTC(year, month - 1, 1));
        var nextMonth = new Date(Date.UTC(year, month, 1));
        var firstDay = monthStart.getUTCDay() === 0 ? 6 : monthStart.getUTCDay() - 1;
        var currentDay = new Date(monthStart);
        var now = new Date();
        var currentDateStr = now.toISOString().split('T')[0];

        var calendarHtml = '<table style="border-collapse: collapse; width: 100%;" id="calendarTable"><tr><th colspan="7">' + 
            monthStart.toLocaleString('default', {month: 'long'}) + ' ' + year + 
            '</th></tr><tr>';
        var days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        for (var day of days) {
            calendarHtml += '<th style="font-size: 0.8em;">' + day + '</th>';
        }
        calendarHtml += '</tr><tr>';
        for (var i = 0; i < firstDay; i++) {
            calendarHtml += '<td></td>';
        }
        while (currentDay < nextMonth) {
            var dateStr = currentDay.toISOString().split('T')[0];
            var risks = dateRisks[dateStr] || [];
            var hocos = dateHocos[dateStr] || [];
            var bgColor = 'white';
            var borderStyle = 'border: 1px solid black';
            var textColor = 'black';
            var kmlId = 'none';
            var hocoIndicator = hocos.length > 0 ? '★' : ''; // Star indicates HOCO availability
            if (risks.length > 0) {
                var primaryRisks = risks.filter(function(risk) {return !risk[0].startsWith('Risk of');});
                var highestRisk = primaryRisks.length > 0 ? 
                    primaryRisks.reduce(function(min, curr) { 
                        return (riskPriority[curr[0]] || 10) < (riskPriority[min[0]] || 10) ? curr : min; 
                    })[0] : null;
                kmlId = risks[0][1];
                bgColor = highestRisk ? riskColorsCal[highestRisk] || 'white' : 'white';
                var hasRiskOf = risks.some(function(risk) {return risk[0].startsWith('Risk of');});
                borderStyle = hasRiskOf ? 'border: 2px solid black' : 'border: 1px solid black';
                textColor = (bgColor === 'red' || bgColor === 'purple') ? 'white' : 'black';
            }
            if (hocos.length > 0) {
                borderStyle += '; border-bottom: 3px dashed green'; // Indicate HOCO with dashed green border
            }
            if (dateStr === currentDateStr) {
                borderStyle += '; border: 3px solid blue';
            }
            calendarHtml += '<td style="background-color: ' + bgColor + '; ' + borderStyle + '; text-align: center; cursor: pointer; color: ' + textColor + '; font-size: 0.8em; padding: 0.2em;" ' +
                'onclick="selectDate(\'' + dateStr + '\');">' + currentDay.getUTCDate() + hocoIndicator + '</td>';
            if (currentDay.getUTCDay() === 0) {
                calendarHtml += '</tr><tr>';
            }
            currentDay.setUTCDate(currentDay.getUTCDate() + 1);
        }
        calendarHtml += '</tr></table>';
        document.getElementById('calendarContainer').innerHTML = calendarHtml;
    }

    function selectDate(dateStr) {
        selectedDate = new Date(dateStr);
        var dropdown = document.getElementById('kmlDropdown');
        dropdown.innerHTML = '<option value="none">No Convective Outlook Avaliable</option>';
        var risks = dateRisks[dateStr] || [];
        var uniqueKmlsMap = new Map();
        risks.forEach(function(item) {
            var risk = item[0];
            var kmlId = item[1];
            var label = item[2];
            var version = item[3];
            if (!uniqueKmlsMap.has(kmlId)) {
                uniqueKmlsMap.set(kmlId, {kmlId: kmlId, label: label, version: version});
            }
        });
        var uniqueKmls = Array.from(uniqueKmlsMap.values()).sort(function(a, b) { 
            return b.version - a.version; 
        });
        uniqueKmls.forEach(function(item) {
            var option = document.createElement('option');
            option.value = item.kmlId;
            option.text = item.label;
            dropdown.appendChild(option);
        });
        var defaultOption = (uniqueKmls.length > 0) ? uniqueKmls[0].kmlId : 'none';
        dropdown.value = defaultOption;
        showLayer(defaultOption);
        updateHocoLayer();
    }

    function toggleLegend() {
        var content = document.getElementById('legendContent');
        var button = document.getElementById('toggleLegend');
        if (content.style.display === 'none') {
            content.style.display = 'block';
            button.innerHTML = '▼';
            updateCalendar();
        } else {
            content.style.display = 'none';
            button.innerHTML = '▲';
        }
    }

    function populateDropdown() {
        var dropdown = document.getElementById('kmlDropdown');
        dropdown.innerHTML = '<option value="none">None</option>';
        if (defaultLayerId !== 'none') {
            var defaultStartTime = kmlTimes[defaultLayerId].split(' to ')[0];
            var versions = [];
            for (var kmlId in kmlVersions) {
                if (kmlTimes[kmlId].startsWith(defaultStartTime)) {
                    versions.push({kmlId: kmlId, label: kmlVersions[kmlId], version: parseInt(kmlVersions[kmlId].split('Version ')[1])});
                }
            }
            versions.sort(function(a, b) { return b.version - a.version; });
            versions.forEach(function(item) {
                var option = document.createElement('option');
                option.value = item.kmlId;
                option.text = item.label;
                dropdown.appendChild(option);
            });
            dropdown.value = defaultLayerId;
        }
    }

        if (!map.getPane('popupPane')) {

        }
        map.getPane('drawnPane').style.zIndex = 1000;

        drawControl = new L.Control.Draw({
            draw: {
                polyline: false,
                polygon: {
                    allowIntersection: false,
                    drawError: { color: '#b00b00', message: 'Polygons cannot intersect!' },
                    shapeOptions: getCurrentShapeOptions()
                },
                circle: false,

                circlemarker: false,
                rectangle: false
            },
            edit: {
                featureGroup: drawnItems,
                edit: true,
                remove: true
            },
            position: 'topleft'
        });
        map.addControl(drawControl);

        document.getElementById('riskLevel').addEventListener('change', function() {
            var riskLevel = this.value;
            var defaultColor = riskColorsCal[riskLevel] || '#000000';
            var colorPicker = document.getElementById('polygonColor');
            if (!userChangedColor) {
                colorPicker.value = defaultColor;
            }
            updateDrawOptions();
        });

        document.getElementById('polygonColor').addEventListener('input', function() {
            userChangedColor = true;
            updateDrawOptions();
        });

        map.on('draw:created', function(e) {
            var layer = e.layer;
            var riskLevel = document.getElementById('riskLevel').value;
            var colorPickerValue = document.getElementById('polygonColor').value;
            var defaultColor = riskColorsCal[riskLevel] || '#000000';
            var color = userChangedColor ? colorPickerValue : defaultColor;

            layer.feature = layer.feature || {};
            layer.feature.properties = layer.feature.properties || {};
            layer.feature.properties['Name'] = riskLevel;

            if (riskLevel === 'Severe risk') {
                layer.setStyle({
                    color: 'black',
                    fillColor: 'black',
                    fillOpacity: 0,
                    weight: 2
                });
            } else {
                layer.setStyle({
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.3,
                    weight: 1
                });
            }

            layer.options.pane = 'drawnPane';
            layer.addTo(map);
            drawnItems.addLayer(layer);

            layer.unbindPopup();
            layer.unbindTooltip();

            layer.on('click', function(e) {
                L.DomEvent.stop(e);
                showEditPopup(layer);
            });
            console.log("Polygon added with style:", layer.options);
        });

        map.on('draw:edited', function(e) {
            e.layers.eachLayer(function(layer) {
                var riskLevel = layer.feature.properties['Name'];
                var color = layer.options.color || '#000000';
                if (riskLevel === 'Severe risk') {
                    layer.setStyle({
                        color: 'black',
                        fillColor: 'black',
                        fillOpacity: 0,
                        weight: 2
                    });
                } else {
                    layer.setStyle({
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.3,
                        weight: 1
                    });
                }
                console.log("Polygon edited:", layer.toGeoJSON());
            });
        });

        map.on('click', function(e) {
            if (drawToolbarVisible && !drawnItems.getBounds().contains(e.latlng)) {
                if (drawControl._toolbars.edit._modes.edit.handler._enabled) {
                    drawControl._toolbars.edit._modes.edit.handler.disable();
                }
                document.querySelector('.leaflet-draw').style.display = 'none';
                drawToolbarVisible = false;
            }
        });

        map.on('draw:deleted', function(e) {
            e.layers.eachLayer(function(layer) {
                map.removeLayer(layer);
            });
            console.log("Polygon deleted. Remaining drawn items count:", drawnItems.getLayers().length);
        });

        fetchLightningData();
        fetchWeatherTimestamps().then(() => {
            var now = new Date();
            var monthDropdown = document.getElementById('monthDropdown');
            var yearDropdown = document.getElementById('yearDropdown');
            monthDropdown.value = now.getUTCMonth() + 1;
            yearDropdown.value = now.getUTCFullYear();
            updateCalendar();
            var currentDateStrLocal = now.toISOString().split('T')[0];
            selectDate(currentDateStrLocal);
            filterExpiredOutlooks();
            showLayer(defaultLayerId);
            updateRangeLimits();
            updateSliderToLatest();
            fetchHocoFiles();
            hocoVisible = false;
            document.getElementById('toggleHoco').innerHTML = 'Show HOCO';
            updateHocoLayer();
        });

        setInterval(fetchLightningData, 30000);
        setInterval(fetchWeatherTimestamps, 300000);
        setInterval(checkFutureHoco, 60000);
    });
