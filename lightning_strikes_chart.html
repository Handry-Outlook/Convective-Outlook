<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Strikes Over Time</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            text-align: center;
        }
        #controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #resolutionSelector, #refreshButton, #startDate, #endDate, #selectAreaButton, #doneButton {
            padding: 5px;
            font-size: 1em;
        }
        #minimap {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            border: none;
            margin: 0;
            transition: all 0.3s ease;
        }
        canvas {
            width: 100% !important;
            max-width: 90vw;
            height: 70vh !important;
        }
        .handry-icon {
            position: fixed;
            top: 10px;
            right: 10px;
            max-width: 50px;
            height: auto;
            z-index: 10000;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.2em; }
            #controls { flex-direction: column; gap: 5px; }
            #resolutionSelector, #refreshButton, #startDate, #endDate, #selectAreaButton, #doneButton { font-size: 0.9em; width: 100%; }
            canvas { max-width: 95vw; height: 50vh !important; }
            .handry-icon { max-width: 30px; top: 5px; right: 5px; }
        }
    </style>
</head>
<body>
    <h1>Lightning Strikes Over Time</h1>
    <img src="https://raw.githubusercontent.com/Handry-Outlook/Convective-Outlook/main/Handry_outlook_icon_pride_small.png" alt="Handry Outlook Icon" class="handry-icon">
    <div id="controls">
        <select id="resolutionSelector" onchange="updateChart()">
            <option value="daily">Daily Strikes</option>
            <option value="weekly">Weekly Strikes</option>
            <option value="monthly" selected>Monthly Strikes</option>
            <option value="yearly">Yearly Strikes</option>
        </select>
        <input type="date" id="startDate" onchange="updateChart()">
        <input type="date" id="endDate" onchange="updateChart()">
        <button id="refreshButton" onclick="fetchLightningData()">Refresh Data</button>
        <button id="selectAreaButton" onclick="showMap()">Select Area</button>
        <button id="doneButton" onclick="hideMap()" style="display: none;">Done</button>
    </div>
    <div id="minimap"></div>
    <canvas id="strikesChart"></canvas>
    <script>
        const lightningUrls = ["https://raw.githubusercontent.com/Handry-Outlook/lightning-map/main/strikes.json", "https://raw.githubusercontent.com/Handry6/lightning-map/main/strikes.json", "https://raw.githubusercontent.com/HandryOutlook/lightning-map3/main/strikes.json", "https://raw.githubusercontent.com/HeiChitLuk/lightning-map3/main/strikes.json", "https://raw.githubusercontent.com/HandryOutlook/lightning-map4/main/strikes.json", "https://raw.githubusercontent.com/HandryOutlook/lightning-map/main/strikes.json"];
        const ukBounds = { minLat: 46.65, maxLat: 61.2, minLon: -11.8, maxLon: 2.4 };
        let lightningData = [];
        let chart;
        let map;
        let drawnItems;
        let selectedBounds = null;

        function initMinimap() {
            map = L.map('minimap', {
                center: [54.013176, -2.3252278],
                zoom: 5,
                minZoom: 4,
                maxZoom: 10,
                zoomControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 18
            }).addTo(map);

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            const drawControl = new L.Control.Draw({
                edit: {
                    featureGroup: drawnItems
                },
                draw: {
                    polyline: false,
                    polygon: false,
                    circle: false,
                    marker: false,
                    circlemarker: false,
                    rectangle: true
                }
            });
            map.addControl(drawControl);

            map.on(L.Draw.Event.CREATED, function (e) {
                if (drawnItems.getLayers().length > 0) {
                    drawnItems.clearLayers();
                }
                const layer = e.layer;
                drawnItems.addLayer(layer);
                selectedBounds = layer.getBounds();
                console.log('Area selected:', selectedBounds.toBBoxString());
                hideMap();
            });

            map.on(L.Draw.Event.EDITED, function (e) {
                e.layers.eachLayer(function (layer) {
                    selectedBounds = layer.getBounds();
                    console.log('Area edited:', selectedBounds.toBBoxString());
                    hideMap();
                });
            });

            map.on(L.Draw.Event.DELETED, function () {
                selectedBounds = null;
                console.log('Selection deleted, reverting to UK-wide data');
                updateChart();
            });

            map.fitBounds([[ukBounds.minLat, ukBounds.minLon], [ukBounds.maxLat, ukBounds.maxLon]]);
        }

        function showMap() {
            const minimap = document.getElementById('minimap');
            const selectButton = document.getElementById('selectAreaButton');
            const doneButton = document.getElementById('doneButton');
            minimap.style.display = 'block';
            selectButton.style.display = 'none';
            doneButton.style.display = 'inline-block';
            if (!map) {
                initMinimap();
            } else {
                map.invalidateSize();
            }
        }

        function hideMap() {
            const minimap = document.getElementById('minimap');
            const selectButton = document.getElementById('selectAreaButton');
            const doneButton = document.getElementById('doneButton');
            minimap.style.display = 'none';
            selectButton.style.display = 'inline-block';
            doneButton.style.display = 'none';
            updateChart();
        }

        function fetchLightningData() {
            fetch(lightningUrl)
                .then(response => response.json())
                .then(data => {
                    lightningData = data.lightning_strikes.map(strike => ({
                        timestamp: strike.strike_time,
                        latitude: strike.coordinates[1],
                        longitude: strike.coordinates[0]
                    }));
                    console.log('Lightning data fetched, total strikes:', lightningData.length);

                    if (lightningData.length > 0) {
                        try {
                            const timestamps = lightningData.map(s => new Date(s.timestamp)).filter(t => !isNaN(t.getTime()));
                            if (timestamps.length > 0) {
                                const minDate = new Date(Math.min(...timestamps)).toISOString().split('T')[0];
                                const maxDate = new Date(Math.max(...timestamps)).toISOString().split('T')[0];
                                document.getElementById('startDate').value = document.getElementById('startDate').value || minDate;
                                document.getElementById('endDate').value = document.getElementById('endDate').value || maxDate;
                            }
                        } catch (e) {
                            console.error('Error processing timestamps:', e);
                        }
                    }
                    updateChart();
                })
                .catch(error => console.error('Error fetching lightning data:', error));
        }

        function processLightningData(resolution) {
            const startDate = document.getElementById('startDate').value ? new Date(document.getElementById('startDate').value) : null;
            const endDate = document.getElementById('endDate').value ? new Date(document.getElementById('endDate').value) : null;
            if (endDate) endDate.setHours(23, 59, 59, 999);
            if (startDate && endDate && startDate > endDate) {
                alert('Start date must be before end date.');
                return {};
            }
            const strikesByPeriod = {};
            let strikeCount = 0;

            lightningData.forEach(strike => {
                const lat = parseFloat(strike.latitude);
                const lon = parseFloat(strike.longitude);
                const withinUK = lat >= ukBounds.minLat && lat <= ukBounds.maxLat && lon >= ukBounds.minLon && lon <= ukBounds.maxLon;
                let withinBounds = true;
                if (selectedBounds) {
                    withinBounds = selectedBounds.contains([lat, lon]);
                    if (withinBounds) strikeCount++;
                }
                if ((selectedBounds && withinBounds) || (!selectedBounds && withinUK)) {
                    const date = new Date(strike.timestamp);
                    if (isNaN(date.getTime())) {
                        console.error('Invalid timestamp:', strike.timestamp);
                        return;
                    }
                    if ((startDate && date < startDate) || (endDate && date > endDate)) return;
                    let key;
                    switch (resolution) {
                        case 'daily':
                            key = date.toISOString().split('T')[0];
                            break;
                        case 'weekly':
                            const year = date.getUTCFullYear();
                            const week = String(getISOWeek(date)).padStart(2, '0');
                            key = `${year}-W${week}`;
                            break;
                        case 'monthly':
                            key = `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}`;
                            break;
                        case 'yearly':
                            key = String(date.getUTCFullYear());
                            break;
                    }
                    strikesByPeriod[key] = (strikesByPeriod[key] || 0) + 1;
                }
            });

            console.log(`Total strikes within selected area: ${strikeCount}`);
            return strikesByPeriod;
        }

        function getISOWeek(date) {
            const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function updateChart() {
            const resolution = document.getElementById('resolutionSelector').value;
            console.log('Updating chart with resolution:', resolution);
            const data = processLightningData(resolution);
            const labels = Object.keys(data).sort();
            const dataset = {
                label: 'Lightning Strikes' + (selectedBounds ? ' (Selected Area)' : ' (UK)'),
                data: labels.map(label => data[label] || 0),
                backgroundColor: '#ffca18',
                barThickness: 50,
                categoryPercentage: 0.8
            };

            console.log('Labels:', labels);
            console.log('Dataset:', dataset);

            if (chart) chart.destroy();

            const ctx = document.getElementById('strikesChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [dataset] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: { display: true, text: resolution.charAt(0).toUpperCase() + resolution.slice(1) + ' Period', font: { size: 14 } },
                            ticks: { font: { size: 12 } }
                        },
                        y: {
                            title: { display: true, text: 'Number of Strikes', font: { size: 14 } },
                            ticks: { font: { size: 12 } },
                            beginAtZero: true,
                            max: Math.ceil(Math.max(...dataset.data) * 1.1)
                        }
                    },
                    plugins: {
                        legend: { position: 'top', labels: { font: { size: 12 }, padding: 5, boxWidth: 20 } },
                        title: {
                            display: true,
                            text: `${resolution.charAt(0).toUpperCase() + resolution.slice(1)} Lightning Strikes` + 
                                  (selectedBounds ? ' in Selected Area' : ' Across the UK') + 
                                  ((document.getElementById('startDate').value || document.getElementById('endDate').value) ? 
                                   ` (${document.getElementById('startDate').value || 'Start'} - ${document.getElementById('endDate').value || 'End'})` : ''),
                            font: { size: 16 },
                            padding: 5
                        }
                    },
                    layout: { padding: { top: 5, bottom: 5, left: 5, right: 5 } }
                }
            });
            console.log('Chart updated with', labels.length, 'data points');
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetchLightningData();
            setInterval(fetchLightningData, 300000);
        });
    </script>
</body>
</html>
