
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lightning Strikes Over Time</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                overflow-x: hidden;
                position: relative;
            }
            h1 {
                font-size: 1.5em;
                margin-bottom: 10px;
                text-align: center;
            }
            #resolutionSelector {
                margin-bottom: 15px;
                padding: 5px;
                font-size: 1em;
            }
            canvas {
                width: 100% !important;
                max-width: 90vw;
                height: 90vh !important;
            }
            .handry-icon {
                position: fixed;
                top: 10px;
                right: 10px;
                max-width: 50px;
                height: auto;
                z-index: 10000;
            }
            @media (max-width: 600px) {
                h1 { font-size: 1.2em; }
                #resolutionSelector { font-size: 0.9em; }
                canvas { max-width: 95vw; height: 70vh !important; }
                .handry-icon { max-width: 30px; top: 5px; right: 5px; }
            }
        </style>
    </head>
    <body>
        <h1>Lightning Strikes Over Time</h1>
        <img src="https://raw.githubusercontent.com/Handry-Outlook/Convective-Outlook/main/Handry_outlook_icon_pride_small.png" alt="Handry Outlook Icon" class="handry-icon">
        <select id="resolutionSelector" onchange="updateChart()">
            <option value="daily">Daily Strikes</option>
            <option value="weekly">Weekly Strikes</option>
            <option value="monthly" selected>Monthly Strikes</option>
            <option value="yearly">Yearly Strikes</option>
        </select>
        <canvas id="strikesChart"></canvas>
        <script>
            const dailyData = {"2025-02-27": 130, "2025-03-01": 59, "2025-03-03": 36, "2025-03-04": 18, "2025-03-08": 6, "2025-03-07": 4};
            const weeklyData = {"2025-W09": 189, "2025-W10": 64};
            const monthlyData = {"2025-02": 130, "2025-03": 123};
            const yearlyData = {"2025": 253};

            let chart;

            function updateChart() {
                const resolution = document.getElementById('resolutionSelector').value;
                let data, labels, title;

                switch (resolution) {
                    case 'daily':
                        data = dailyData;
                        labels = Object.keys(data).sort();
                        title = 'Daily Lightning Strikes';
                        break;
                    case 'weekly':
                        data = weeklyData;
                        labels = Object.keys(data).sort();
                        title = 'Weekly Lightning Strikes';
                        break;
                    case 'monthly':
                        data = monthlyData;
                        labels = Object.keys(data).sort();
                        title = 'Monthly Lightning Strikes';
                        break;
                    case 'yearly':
                        data = yearlyData;
                        labels = Object.keys(data).sort();
                        title = 'Yearly Lightning Strikes';
                        break;
                }

                const dataset = {
                    label: 'Lightning Strikes',
                    data: labels.map(label => data[label] || 0),
                    backgroundColor: '#4682B4', // Steel Blue
                };

                if (chart) chart.destroy();

                const ctx = document.getElementById('strikesChart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: labels, datasets: [dataset] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { 
                                title: { display: true, text: resolution.charAt(0).toUpperCase() + resolution.slice(1) + ' Period', font: { size: 14 } },
                                ticks: { font: { size: 12 } }
                            },
                            y: { 
                                title: { display: true, text: 'Number of Strikes', font: { size: 14 } },
                                ticks: { font: { size: 12 } },
                                beginAtZero: true
                            }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { font: { size: 12 }, padding: 10, boxWidth: 20 } },
                            title: { display: true, text: title + ' Across the UK', font: { size: 16 } }
                        },
                        layout: { padding: { top: 10, bottom: 10, left: 10, right: 10 } }
                    }
                });
            }

            // Initial chart load
            updateChart();
        </script>
    </body>
    </html>
